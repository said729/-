<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دفتر الكريدي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7ae0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f7f9fd;--card:#fff;--ink:#1c2a44;--mute:#7a8ba5;--line:#e3ecf7;--acc:#1f7ae0;--soft:#e6f0fd;--debt:#e5484d;--paid:#2f9e5f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1622;--card:#16202f;--ink:#e8eefb;--mute:#8b9bb5;--line:#26344a;--acc:#5aa2ff;--soft:#1c2b45;--debt:#ff8a8f;--paid:#5fd394}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:2px 0 10px}h2{font-size:1.05rem;margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(31,60,120,.08);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card small{display:block;color:var(--acc);font-weight:600}.card b{font-size:1.9rem;color:var(--paid)}.dd b{color:var(--debt)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .card{margin:0 0 12px;padding:10px 12px}.two b{font-size:1.2rem}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.g{background:var(--soft);color:var(--acc)}
.r{background:color-mix(in srgb,var(--debt) 15%,transparent);color:var(--debt)}.p{background:color-mix(in srgb,var(--paid) 18%,transparent);color:var(--paid)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;gap:8px;margin:8px 0}.bar>*{flex:1}
.seg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}.seg button{background:none;color:var(--mute)}.seg .on{background:var(--soft);color:var(--acc)}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.row[data-a]{cursor:pointer}
.amt{font-weight:800;white-space:nowrap}.d{color:var(--debt)}.pd{color:var(--paid)}
.mute{color:var(--mute);font-size:.85rem}.empty{padding:22px;text-align:center;color:var(--mute);background:var(--card)}
.x{background:none;color:var(--mute);padding:2px 8px;border:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:8px 4px;font-size:.8rem}nav svg{display:block;margin:0 auto 2px;width:24px;height:24px}nav .on{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}.top button{padding:8px 12px}.top svg{width:22px;height:22px;display:block}.av{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-style:normal;font-weight:800;flex:none}.gr{flex:1}.amt small{font-weight:400;font-size:.8rem}.fab{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:14px 22px;box-shadow:0 4px 14px rgba(31,122,224,.4)}.list{margin-bottom:70px}table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid var(--line)}
@media print{nav,button,.btn,input,.np{display:none!important}body{background:#fff;color:#000;padding:0}.card{background:#eee;color:#000}}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-a="tab" data-t="debt" id="t-debt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1zM21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z"/></svg>دفتر الديون</button>
<button data-a="tab" data-t="cash" id="t-cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2zM4 7l12-3v3M15 14h5"/></svg>دفتر النقدية</button>
<button data-a="tab" data-t="more" id="t-more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>المزيد</button>
</nav>
<script>
var K='',acct=null,S={p:[],cash:[],hide:false},tab='debt',ty='c',cur=null,q='',sa=false;
function norm(o){if(o.c&&!o.p){o.p=o.c.map(function(c){return{id:c.id,n:c.n,ph:'',ty:'c',t:c.t}})}return{p:o.p||[],cash:o.cash||[],hide:!!o.hide}}
function enter(ph){acct=ph;K='kridi-d-'+ph;S={p:[],cash:[],hide:false};try{var r=localStorage.getItem(K);if(r)S=norm(JSON.parse(r));localStorage.setItem('kridi-last',ph)}catch(e){}}
function login(){try{var ph=$('lp').value.replace(/\D/g,''),pin=$('lc').value;
if(ph.length<9||!/^\d{4}$/.test(pin)){alert('دخل رقم هاتف صحيح ورمز من 4 أرقام');return}
var A=JSON.parse(localStorage.getItem('kridi-accs')||'{}'),h=btoa(pin+ph);
if(A[ph]){if(A[ph]!==h){alert('الرمز غالط');return}}
else{var mg=!Object.keys(A).length&&localStorage.getItem('kridi-v2');A[ph]=h;localStorage.setItem('kridi-accs',JSON.stringify(A));if(mg&&!localStorage.getItem('kridi-d-'+ph))localStorage.setItem('kridi-d-'+ph,mg)}
tab='debt';enter(ph);R()}catch(e){alert('المتصفح ما خلاناش نحفظو الحساب')}}
var impTy='c';
function amt(s){return s==='-'||/^-?[\d.\s]*\d,\d{2}$/.test(s)}
function pv(s){return s==='-'?0:parseFloat(s.replace(/[\s.]/g,'').replace(',','.'))||0}
function parseRows(rows){var res=[];rows.forEach(function(r){
if(r.length<4||!/^\d{1,4}$/.test(r[0]))return;
var am=[],rest=[];r.slice(1).forEach(function(s){(amt(s)?am:rest).push(s)});
if(am.length<3)return;am=am.slice(-3);
var ph='',nm=[];rest.forEach(function(s){var z=s.replace(/\s/g,'');if(!ph&&/^\+?\d{9,14}$/.test(z))ph=z;else nm.push(s)});
res.push({n:nm.join(' ')||'عميل '+r[0],ph:ph,g:pv(am[0]),k:pv(am[1])})});return res}
function ldPdf(cb){if(window.pdfjsLib)return cb();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=function(){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';cb()};s.onerror=function(){alert('خاص الإنترنت باش نحملو قارئ PDF')};document.head.appendChild(s)}
function readPdf(file,t){ldPdf(function(){var fr=new FileReader();fr.onload=function(){
pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(doc){var ps=[];for(var i=1;i<=doc.numPages;i++)ps.push(doc.getPage(i).then(function(pg){return pg.getTextContent()}));return Promise.all(ps)}).then(function(pages){
var rows=[];pages.forEach(function(tc){var L=[];tc.items.forEach(function(it){var x=it.str.trim();if(!x)return;var y=it.transform[5],r=L.find(function(a){return Math.abs(a.y-y)<6});if(!r){r={y:y,c:[]};L.push(r)}r.c.push({x:it.transform[4],s:x})});
L.sort(function(a,b){return b.y-a.y}).forEach(function(r){rows.push(r.c.sort(function(a,b){return b.x-a.x}).map(function(c){return c.s}))})});
var res=parseRows(rows);if(!res.length){alert('ما قدرتش نقرا الجدول فهاد PDF');return}
var ex=S.p.map(function(p){return p.n.toLowerCase()}),nw=res.filter(function(x){return ex.indexOf(x.n.toLowerCase())<0});
if(!nw.length){alert('كلشي كاين من قبل');return}
var g=0,k=0;nw.forEach(function(x){g+=x.g;k+=x.k});var f=nw[0];
if(!confirm('لقيت '+res.length+' فالملف ('+nw.length+' جداد)\nمجموع أعطيت: '+Math.round(g*100)/100+'\nمجموع أخذت: '+Math.round(k*100)/100+'\nالأول: '+f.n+' | '+f.ph+' | '+f.g+' | '+f.k+'\nنزيدهم؟'))return;
var now=Date.now();nw.forEach(function(x,i){var t2=[];if(x.g>0)t2.push({k:'d',a:x.g,m:'استيراد من كناش',d:now});if(x.k>0)t2.push({k:'p',a:x.k,m:'استيراد من كناش',d:now+1});S.p.push({id:now.toString(36)+i,n:x.n,ph:x.ph,ty:t,t:t2})});
save();ty=t;tab='debt';cur=null;R();alert('تزادو '+nw.length+' فالدفتر')}).catch(function(){alert('ما قدرتش نحل PDF')})};fr.readAsArrayBuffer(file)})}
function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)))}
function ub64(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function bioGet(){try{return JSON.parse(localStorage.getItem('kridi-bio'))}catch(e){return null}}
function bioOn(){if(!window.PublicKeyCredential||!navigator.credentials){alert('هاد المتصفح ما كيدعمش البصمة. جرب Chrome على رابط https.');return}
navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'دفتر الكريدي'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:acct,displayName:acct},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}}).then(function(c){localStorage.setItem('kridi-bio',JSON.stringify({ph:acct,id:b64(c.rawId)}));alert('تفعلات البصمة');R()}).catch(function(){alert('ما تفعلاتش البصمة. تأكد بلي عندك بصمة مسجلة فالتيليفون.')})}
function bioLogin(){var b=bioGet();if(!b)return;navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(b.id)}],userVerification:'required',timeout:60000}}).then(function(){tab='debt';enter(b.ph);R()}).catch(function(){alert('البصمة ما تقبلاتش')})}
function loginHtml(){if(fbOn)return'<h1>دفتر الكريدي</h1>'+(sent?'<p class="mute">بعثنا كود التأكيد لـ '+esc(sent)+'</p><input id="lc" type="tel" inputmode="numeric" placeholder="الكود" autocomplete="one-time-code"><button data-a="fconf" style="width:100%">تأكيد</button><button class="g" data-a="fback" style="width:100%;margin-top:8px">بدل الرقم</button>':'<p class="mute">دخل رقم هاتفك وغنبعثو ليك كود تأكيد فـ SMS.</p><input id="lp" type="tel" inputmode="numeric" placeholder="رقم الهاتف (0612345678)"><button data-a="fsend" style="width:100%">بعث الكود</button>')+'<div id="rc"></div>';return'<h1>دفتر الكريدي</h1>'+(bioGet()?'<button data-a="bl" style="width:100%;margin-bottom:14px">🔓 دخول بالبصمة</button>':'')+'<p class="mute">دخل بالهاتف. إلا كان الرقم جديد كيتصاوب ليك حساب.</p><input id="lp" type="tel" inputmode="numeric" placeholder="رقم الهاتف"><input id="lc" type="password" inputmode="numeric" maxlength="4" placeholder="رمز سري (4 أرقام)"><button data-a="login" style="width:100%">دخول / إنشاء حساب</button><p class="mute">الحساب والبيانات كيتخزنو فهاد الجهاز فقط.</p>'}
function topbar(){return'<div class="top np"><span>📒 '+esc(acct)+'</span><button class="g" data-a="hide" aria-label="خبّي أو أظهر المبالغ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'+(S.hide?'<path d="M3 3l18 18"/>':'')+'</svg></button></div>'}
/* SMS: لصق إعدادات Firebase هنا (شوف README). إلا بقات خاوية كيخدم الدخول المحلي بالرمز */
var FB={apiKey:'',authDomain:'',projectId:'',appId:''};
var fbOn=!!FB.apiKey,fbAuth=null,conf=null,sent=false;
function fbInit(){var u=['app','auth'],i=0;(function n(){if(i>=u.length){try{firebase.initializeApp(FB);fbAuth=firebase.auth();fbAuth.languageCode='ar';fbAuth.onAuthStateChanged(function(x){if(x&&x.phoneNumber){enter(x.phoneNumber.replace(/\D/g,''));R()}})}catch(e){alert('إعدادات Firebase غالطة')}return}var t=document.createElement('script');t.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-'+u[i++]+'-compat.js';t.onload=n;t.onerror=function(){alert('ما قدرناش نحملو Firebase. تأكد من الإنترنت.')};document.head.appendChild(t)})()}
function fsend(){if(!fbAuth){alert('استنى شوية وعاود');return}
var raw=$('lp').value.trim(),d=raw.replace(/\D/g,'');if(d.length<9){alert('دخل رقم هاتف صحيح');return}
var ph=raw.charAt(0)==='+'?'+'+d:(d.charAt(0)==='0'?'+212'+d.slice(1):'+'+d);
var v=new firebase.auth.RecaptchaVerifier('rc',{size:'invisible'});
fbAuth.signInWithPhoneNumber(ph,v).then(function(c){conf=c;sent=ph;R()}).catch(function(e){try{v.clear()}catch(x){}alert('ما قدرناش نبعثو الكود: '+(e.code||e.message))})}
function fconf(){var c=$('lc').value.trim();if(!c||!conf)return;conf.confirm(c).then(function(){sent=false;conf=null}).catch(function(){alert('الكود غالط')})}
var last=null;try{last=localStorage.getItem('kridi-last')}catch(e){}if(last&&!fbOn&&!bioGet())enter(last);
function save(){if(!acct)return;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return S.hide?'****':(Math.round(n*100)/100).toLocaleString('fr-FR')}
function fd(d){return new Date(d).toLocaleDateString('fr-FR')}
function bal(p){return p.t.reduce(function(a,t){return a+(t.k==='d'?t.a:-t.a)},0)}
function sum(ty){return S.p.filter(function(p){return p.ty===ty}).reduce(function(a,p){return a+Math.max(bal(p),0)},0)}
function num(){var a=parseFloat($('am').value);if(!(a>0)){alert('كتب المبلغ');return 0}return a}
function list(){
  var L=S.p.filter(function(p){return p.ty===ty&&p.n.toLowerCase().indexOf(q.toLowerCase())>-1});
  if(!L.length)return'<div class="empty">'+(S.p.some(function(p){return p.ty===ty})?'ما لقيت حتى واحد':'زيد أول '+(ty==='c'?'عميل':'مورد')+' من فوق')+'</div>';
  return L.map(function(p){var b=bal(p),l=p.t.length?'مضت '+Math.floor((Date.now()-p.t[p.t.length-1].d)/864e5)+' أيام':'';
    return'<div class="row" data-a="op" data-i="'+p.id+'"><i class="av">'+esc(p.n.charAt(0).toUpperCase())+'</i><span class="gr">'+esc(p.n)+'<br><small class="mute">'+l+'</small></span><span class="amt '+(b>0?'d':'pd')+'">'+fmt(b)+' درهم<br><small class="mute">'+(b>0?(ty==='c'?'أعطيت':'أخذت'):'')+'</small></span></div>'}).join('')}
function debt(){
  return'<div class="bar seg"><button data-a="ty" data-t="c" class="'+(ty==='c'?'on':'')+'">العملاء</button><button data-a="ty" data-t="s" class="'+(ty==='s'?'on':'')+'">الموردين</button></div>'
  +'<div class="card dd"><small>'+(ty==='c'?'عند العملاء ليا':'عندي للموردين')+'</small><b>'+fmt(sum(ty))+'</b> درهم</div>'
  +'<input id="q" placeholder="بحث" value="'+esc(q)+'">'
  +(sa?'<div class="bar"><input id="nn" placeholder="الاسم" style="margin:0;flex:2"><input id="ph" type="tel" placeholder="الهاتف" style="margin:0;flex:2"><button data-a="add">زيد</button></div>':'')
  +'<div class="list" id="pl">'+list()+'</div><button class="fab np" data-a="sa">'+(sa?'إلغاء':'+ إضافة '+(ty==='c'?'عميل':'مورد'))+'</button>'}
function detail(){
  var p=S.p.find(function(x){return x.id===cur});if(!p){cur=null;return debt()}
  var b=bal(p),c=p.ty==='c',ph=(p.ph||'').replace(/\D/g,'').replace(/^0/,'212');
  var msg=encodeURIComponent('سلام '+p.n+'، باقي عليك '+(Math.round(b*100)/100)+' درهم. عافاك خلصني فأقرب وقت. شكرا.');
  var h=p.t.map(function(t,i){return'<div class="row"><span>'+(t.k==='d'?(c?'دين':'شريت'):(c?'أدّى':'خلصت'))+'<br><small class="mute">'+fd(t.d)+(t.m?' - '+esc(t.m):'')+'</small></span><span><b class="amt '+(t.k==='d'?'d':'pd')+'">'+fmt(t.a)+'</b><button class="x np" data-a="dt" data-i="'+i+'">✕</button></span></div>'}).reverse().join('');
  return'<button class="g np" data-a="back">رجوع</button><h1>'+esc(p.n)+'</h1><div class="mute">'+esc(p.ph||'')+'</div>'
  +'<div class="card"><small>الباقي</small><b>'+fmt(b)+'</b> درهم</div>'
  +'<input id="am" type="number" inputmode="decimal" placeholder="المبلغ"><input id="nt" placeholder="ملاحظة (اختياري)">'
  +'<div class="bar"><button class="r" data-a="tx" data-k="d">+ '+(c?'دين جديد':'شريت بالكريدي')+'</button><button class="p" data-a="tx" data-k="p">− '+(c?'أدّى':'خلصت')+'</button></div>'
  +'<div class="bar np">'+(ph&&b>0?'<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/'+ph+'?text='+msg+'">تذكير واتساب</a>':'')+'<button class="g" data-a="pr">طبع / PDF</button></div>'
  +'<div class="list">'+(h||'<div class="empty">ما كاين حتى معاملة</div>')+'</div>'
  +'<div class="bar np"><button class="g" data-a="dp">حذف</button></div>'}
function cash(){
  var i=0,e=0,m=new Date().getMonth(),mi=0,me=0;
  S.cash.forEach(function(c){var mm=new Date(c.d).getMonth()===m;if(c.k==='i'){i+=c.a;if(mm)mi+=c.a}else{e+=c.a;if(mm)me+=c.a}});
  var h=S.cash.map(function(c,x){return'<div class="row"><span>'+(c.k==='i'?'دخل':'مصروف')+'<br><small class="mute">'+fd(c.d)+(c.m?' - '+esc(c.m):'')+'</small></span><span><b class="amt '+(c.k==='i'?'pd':'d')+'">'+fmt(c.a)+'</b><button class="x" data-a="dc" data-i="'+x+'">✕</button></span></div>'}).reverse().join('');
  return'<h1>دفتر النقدية</h1><div class="card"><small>الرصيد</small><b>'+fmt(i-e)+'</b> درهم</div>'
  +'<div class="two"><div class="card"><small>هاد الشهر: دخل</small><b>'+fmt(mi)+'</b></div><div class="card"><small>هاد الشهر: مصروف</small><b>'+fmt(me)+'</b></div></div>'
  +'<input id="am" type="number" inputmode="decimal" placeholder="المبلغ"><input id="nt" placeholder="ملاحظة (اختياري)">'
  +'<div class="bar"><button class="p" data-a="cx" data-k="i">+ دخل</button><button class="r" data-a="cx" data-k="e">− مصروف</button></div>'
  +'<div class="list">'+(h||'<div class="empty">ما كاين حتى معاملة</div>')+'</div>'}
function more(){
  function rows(t){var L=S.p.filter(function(p){return p.ty===t});return L.length?L.map(function(p){return'<tr><td>'+esc(p.n)+'</td><td class="amt">'+fmt(bal(p))+' درهم</td></tr>'}).join(''):'<tr><td class="mute">فارغ</td></tr>'}
  return'<h1>المزيد</h1><div class="np"><div class="bar"><button class="g" data-a="out">خروج ('+esc(acct)+')</button><button class="g" data-a="pr">طبع التقرير / PDF</button></div>'
  +'<div class="bar"><button class="g" data-a="bk">نسخ احتياطي (تحميل)</button><button class="g" data-a="rs">استرجاع نسخة</button></div>'
  +'<div class="bar"><button class="g" data-a="'+(bioGet()?'bx':'bn')+'">'+(bioGet()?'إلغاء البصمة':'تفعيل البصمة')+'</button></div><div class="bar"><button class="g" data-a="ip" data-t="c">استيراد PDF كناش (عملاء)</button><button class="g" data-a="ip" data-t="s">PDF (موردين)</button></div><input id="fp" type="file" accept="application/pdf,.pdf" style="display:none"><input id="fl" type="file" accept=".json,application/json" style="display:none"></div>'
  +'<h2>تقرير الديون</h2><b>العملاء</b> ('+fmt(sum('c'))+' درهم)<table>'+rows('c')+'</table><br><b>الموردين</b> ('+fmt(sum('s'))+' درهم)<table>'+rows('s')+'</table>'
  +'<p class="mute np">البيانات كتتخزن فهاد الجهاز فقط. دير نسخ احتياطي بانتظام. للتثبيت: قائمة المتصفح ← إضافة للشاشة الرئيسية.</p>'}
function R(){
  document.querySelector('nav').style.display=acct?'flex':'none';if(!acct){$('app').innerHTML=loginHtml();return}$('app').innerHTML=topbar()+(tab==='debt'?(cur?detail():debt()):tab==='cash'?cash():more());
  ['debt','cash','more'].forEach(function(t){$('t-'+t).className=t===tab?'on':''});
  var f=$('fl');if(f)f.onchange=function(){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.p&&!o.c)throw 0;S=norm(o);save();R();alert('تسترجعات البيانات')}catch(e){alert('الملف ماشي صحيح')}};if(f.files[0])r.readAsText(f.files[0])};
  var g=$('fp');if(g)g.onchange=function(){if(g.files[0])readPdf(g.files[0],impTy);g.value=''}}
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;$('pl').innerHTML=list()}});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,d=t.dataset,p=cur&&S.p.find(function(x){return x.id===cur});
  if(a==='tab'){tab=d.t;cur=null;sa=false}
  else if(a==='ty'){ty=d.t;q=''}
  else if(a==='add'){var n=$('nn').value.trim();if(!n)return;S.p.push({id:Date.now().toString(36),n:n,ph:$('ph').value.trim(),ty:ty,t:[]});sa=false}
  else if(a==='sa')sa=!sa;
  else if(a==='op')cur=d.i;
  else if(a==='back')cur=null;
  else if(a==='tx'){var x=num();if(!x)return;p.t.push({k:d.k,a:x,m:$('nt').value.trim(),d:Date.now()})}
  else if(a==='dt'){if(!confirm('حذف هاد المعاملة؟'))return;p.t.splice(+d.i,1)}
  else if(a==='dp'){if(!confirm('حذف '+p.n+' وكل معاملاتو؟'))return;S.p=S.p.filter(function(y){return y!==p});cur=null}
  else if(a==='cx'){var y=num();if(!y)return;S.cash.push({k:d.k,a:y,m:$('nt').value.trim(),d:Date.now()})}
  else if(a==='dc'){if(!confirm('حذف هاد المعاملة؟'))return;S.cash.splice(+d.i,1)}
  else if(a==='hide')S.hide=!S.hide;
  else if(a==='login'){login();return}
  else if(a==='bn'){bioOn();return}
  else if(a==='ip'){impTy=d.t;$('fp').click();return}
  else if(a==='bl'){bioLogin();return}
  else if(a==='bx'){try{localStorage.removeItem('kridi-bio')}catch(e){}}
  else if(a==='fsend'){fsend();return}
  else if(a==='fconf'){fconf();return}
  else if(a==='fback')sent=false;
  else if(a==='out'){try{localStorage.removeItem('kridi-last')}catch(e){}if(fbOn&&fbAuth)fbAuth.signOut();acct=null;cur=null;R();return}
  else if(a==='pr'){window.print();return}
  else if(a==='rs'){$('fl').click();return}
  else if(a==='bk'){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='kridi-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();return}
  save();R()});
R();
if(fbOn)fbInit();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
